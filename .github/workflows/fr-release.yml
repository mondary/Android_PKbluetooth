name: FR release

# Publie une release "latest" avec l'APK signé et update.json,
# consommés par le bouton « Vérifier » de l'app (branche fr-live uniquement).

on:
  push:
    branches: [ "fr-live" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & publish FR APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/vibepop-fr.jks
          cp app/vibepop-fr.jks vibepop-fr.jks
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=vibepop-fr.jks\n" \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > keystore.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed release APK
        id: build
        run: |
          VERSION_NAME="$(grep -m1 -oE '^### \[[0-9]{4}\.[0-9]{2}\.[0-9]+\]' CHANGELOG.md | sed -E 's/^### \[([0-9.]+)\]$/\1/')"
          if [ -z "$VERSION_NAME" ]; then
            echo "No CalVer release heading found in CHANGELOG.md" >&2
            exit 1
          fi
          VERSION_CODE="$(python3 -c 'import sys; y, m, p = map(int, sys.argv[1].split(".")); print(y * 10000 + m * 100 + p)' "$VERSION_NAME")"
          if [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "Android versionCode exceeds the platform limit: $VERSION_CODE" >&2
            exit 1
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          ./gradlew assembleRelease --no-daemon

      - name: Build update.json
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk VibePop-fr.apk
          python3 - <<'PY'
          import hashlib, json, os
          with open("VibePop-fr.apk", "rb") as fh:
              digest = hashlib.sha256(fh.read()).hexdigest()
          lines = [line for line in (os.environ.get("COMMIT_MSG") or "").splitlines() if line.strip()]
          data = {
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": os.environ["VERSION_NAME"],
              "apkUrl": "https://github.com/mondary/vibepop/releases/latest/download/VibePop-fr.apk",
              "sha256": digest,
              "notes": lines[0][:200] if lines else "Build automatique",
          }
          with open("update.json", "w", encoding="utf-8") as fh:
              json.dump(data, fh, ensure_ascii=False, indent=2)
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fr.${{ github.run_number }}
          name: VibePop FR — ${{ steps.build.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          body: |
            Build automatique du commit ${{ github.sha }} (branche `fr-live`).
            L'application le détecte via `update.json`.
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: |
            VibePop-fr.apk
            update.json
