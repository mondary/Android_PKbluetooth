name: Signed Android release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configure the permanent Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > chromepkbluetooth-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=chromepkbluetooth-release.jks\n' \
            "$KEYSTORE_PASSWORD" "${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" "$KEY_ALIAS" > keystore.properties

      - name: Test and build the signed APK
        run: ./gradlew test assembleRelease --no-daemon

      - name: Prepare stable download and update manifest
        run: |
          VERSION="$(grep -m1 -oE '^### \[[0-9]{4}\.[0-9]{2}\.[0-9]+\]' CHANGELOG.md | sed -E 's/^### \[([0-9.]+)\]$/\1/')"
          test -n "$VERSION"
          cp app/build/outputs/apk/release/app-release.apk Chrome_PKbluetooth.apk
          SHA256="$(sha256sum Chrome_PKbluetooth.apk | cut -d' ' -f1)"
          VERSION_NAME="$VERSION" VERSION_CODE="$(python3 -c 'import sys; y,m,p=map(int,sys.argv[1].split(".")); print(y*10000+m*100+p)' "$VERSION")" SHA256="$SHA256" python3 - <<'PY'
          import json, os
          version = os.environ["VERSION_NAME"]
          data = {
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": version,
              "apkUrl": "https://github.com/mondary/Chrome_PKbluetooth/releases/latest/download/Chrome_PKbluetooth.apk",
              "sha256": os.environ["SHA256"],
              "notes": f"Chrome_PKbluetooth {version}. See the release notes for changes.",
          }
          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PY

      - uses: softprops/action-gh-release@v2
        with:
          name: Chrome_PKbluetooth ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            Chrome_PKbluetooth.apk
            update.json
